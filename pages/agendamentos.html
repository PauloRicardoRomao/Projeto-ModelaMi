<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModelaMi</title>
    <link rel="stylesheet" type="text/css" href="../assets/css/folhadeestilo.css">
    <link rel="icon" type="image/x-icon" href="../assets/icons/Modela-Mi-logo-cópia-transparente.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;
    1,300..700&Montserrat:wght@100..900&family=Playfair+Display:ital,wght@0,
    400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="../assets/images/logo-mobile.png" alt="logo" class="logo-menu-mobile">
        <nav class="container-menu">
            <ul>
                <li><a href="../index.html">HOME</a></li>
                <li><a href="procedimentos.html">PROCEDIMENTOS</a></li>
                <li><a href="https://www.afinese.com.br/" target="_blank">AFINE-SE</a></li>
                <li><a href="sobre.html">SOBRE</a></li>
                <li><a href="contato.html">CONTATO</a></li>
            </ul>
        </nav>
        <span class="menu-mobile">&#9776;</span>
    </header>
    
    <main class="container-principal-agendamento">
        <section class="container-dados-agendamento">
            <h2>Confirmação de Agendamento</h2>
            <div class="container-forms-agendamento" id="container-forms-agendamento">
                <form>
                    <div class="linha-form-agendamento">
                        <label for="input-codigo" id="lbl-codigo-agendamento">Código:</label>
                        <input type="text" name="input-codigo" id="codigo-agendamento" required disabled>
                    </div>
                    <div class="linha-form-agendamento">
                        <label for="input-nome">Nome:</label>
                        <input type="text" name="input-nome" id="input-nome" required>
                    </div>
                    <div class="linha-form-agendamento">
                        <label for="input-email">Email:</label>
                        <input type="email" name="input-email" id="input-email">
                    </div>
                    <div class="linha-form-agendamento">
                        <label for="input-telefone">Telefone:</label>
                        <input type="tel" name="input-telefone" id="input-telefone" placeholder="()" required>
                    </div>
                </form>
                <form>
                    <div class="linha-form-agendamento">
                        <label for="input-procedimento">Procedimento:</label>
                        <input type="text" name="input-procedimento" id="input-procedimento" required disabled>
                    </div>
                    <div class="linha-form-agendamento">
                        <label for="input-data-marcada">Data Marcada:</label>
                        <input type="datetime-local" name="input-data-marcada" id="input-data-marcada" required>
                    </div>
                    <div class="linha-form-agendamento">
                        <label for="input-local">Local:</label>
                        <input type="text" name="input-local" id="input-local" required disabled>
                    </div>
                    <div class="linha-form-agendamento">
                        <label for="input-valor">Valor:</label>
                        <input type="text" name="input-valor" id="input-valor" placeholder="0,00" required disabled>
                    </div>
                </form> 
            </div>
            <div class="container-btns-agendamento">
                <button type="button" id="btn-cancelar-agendamento">Cancelar Agendamento</button>
                <button type="button" id="btn-realizar-pagamento">Realizar Pagamento</button>
            </div>
        </section>
    </main>
    
    
    <footer>
        <p class="texto-direitos">© 2025 - Todos os direitos reservados</p>
    </footer>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/script_verificacao_agendamentos.js"></script>
</body>
</html>
